[project]
name = "koylasetu-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependencies are declared as argument defaults on purpose.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query", "app.core.deps.require",
]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Library-internal deprecation notice from FastAPI's TestClient, nothing to fix on our side.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
